<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あかり消し</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#141a36; --panel:#1d2550; --off:#2a3470; --off-edge:#3a4690;
  --on:#ffc857; --on-glow:rgba(255,200,87,.55); --text:#eef2ff; --sub:#a9b4e6; --btn:#2a3470; --ink:#141a36;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#eef1fb; --panel:#dde3f7; --off:#9aa6dc; --off-edge:#7f8cc9;
    --on:#ffb524; --on-glow:rgba(255,181,36,.6); --text:#1b2250; --sub:#4a5598; --btn:#c9d1f0; --ink:#1b2250;
  }
}
:root[data-theme="light"]{color-scheme:light;--bg:#eef1fb;--panel:#dde3f7;--off:#9aa6dc;--off-edge:#7f8cc9;--on:#ffb524;--on-glow:rgba(255,181,36,.6);--text:#1b2250;--sub:#4a5598;--btn:#c9d1f0;--ink:#1b2250}
:root[data-theme="dark"]{color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:20px 18px 28px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
h1{font-size:2rem;font-weight:900;margin:8px 0 0;letter-spacing:.08em}
.rule{margin:0;color:var(--sub);font-size:.95rem;line-height:1.7}
[hidden]{display:none!important}
.sizes,.tabs,.act{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:700;color:var(--text);background:var(--btn);border:2px solid transparent;border-radius:999px;padding:10px 12px;cursor:pointer;min-height:44px}
.sizes button,.tabs button,.act button{flex:1 1 0;min-width:0}
.sizes button{padding:10px 2px}
.act button{flex:1 1 auto}
.tabs button{flex:1 1 28%}
button[aria-pressed="true"]{border-color:var(--on)}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.stat{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;font-weight:700}
.stat b{font-size:2.2rem;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{color:var(--sub)}
.stat #ttl{color:var(--text);font-size:1.2rem}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stg{aspect-ratio:1/1;border-radius:18px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:1.3rem;font-weight:900}
.stg small{font-size:.62rem;color:var(--on);letter-spacing:0;line-height:1}
.stg:disabled{opacity:.35;cursor:not-allowed}
.stg.cleared{border-color:var(--on)}
.board{position:relative;display:grid;gap:10px;background:var(--panel);padding:14px;border-radius:24px;aspect-ratio:1/1;touch-action:manipulation}
.cell{border:0;border-radius:50%;background:var(--off);box-shadow:inset 0 0 0 3px var(--off-edge);cursor:pointer;transition:background .18s,box-shadow .18s,transform .12s;padding:0;min-height:0}
.cell:active{transform:scale(.92)}
.cell.on{background:var(--on);box-shadow:0 0 22px 4px var(--on-glow)}
.cell.hint{outline:4px solid var(--text);outline-offset:3px;animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{outline-offset:3px}50%{outline-offset:7px}}
.msg{min-height:2.6em;margin:0;font-weight:700;line-height:1.5}
.win{animation:pop .5s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
#next{background:var(--on);color:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tools{display:flex;gap:8px}
.tools button{flex:none;width:44px;padding:0;border-radius:50%;font-size:1.1rem}
.stat #tm{margin-left:14px;font-size:2.2rem;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums}
.quiet{background:transparent;border-color:var(--btn);color:var(--sub);font-weight:500;font-size:.85rem;align-self:center}
.total{display:flex;justify-content:space-between;font-weight:700;background:var(--panel);border-radius:16px;padding:12px 16px}
.total b{color:var(--on)}
.ov{position:fixed;inset:0;background:rgba(10,14,36,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.card{background:var(--panel);border-radius:24px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.card h2{margin:0;font-size:1.4rem}
.card ol{margin:0;padding-left:1.3em;line-height:1.8}
.card button{background:var(--on);color:var(--ink)}
.cell.wave{animation:wave .7s ease var(--d,0ms) both}
@keyframes wave{0%{background:var(--off);box-shadow:inset 0 0 0 3px var(--off-edge)}40%{background:var(--on);box-shadow:0 0 22px 6px var(--on-glow);transform:scale(1.12)}100%{background:var(--off);box-shadow:inset 0 0 0 3px var(--off-edge);transform:none}}
.pt{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:burst 1.1s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.cell,.win,.cell.hint,.cell.wave{transition:none;animation:none}.pt{display:none}}
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>あかり消し</h1>
    <div class="tools">
      <button id="help-btn" aria-label="遊び方">?</button>
      <button id="clr" aria-label="明かりの色を変える">🎨</button>
      <button id="snd" aria-pressed="true" aria-label="効果音と振動">🔊</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="group" aria-label="モード">
    <button data-m="stage" aria-pressed="true">ステージ</button>
    <button data-m="free" aria-pressed="false">練習</button>
    <button data-m="daily" aria-pressed="false">毎日</button>
    <button data-m="mlim" aria-pressed="false">手数制限</button>
    <button data-m="tlim" aria-pressed="false">時間制限</button>
  </div>

  <section id="select" style="display:flex;flex-direction:column;gap:14px">
    <p class="rule">ステージを順番にクリアして、すべての明かりを消そう。最短手数でクリアすると★3つ。前のステージをクリアすると次が開きます。</p>
    <div class="total" id="total"></div>
    <div class="stages" id="stages"></div>
    <p class="rule">1〜5は3×3、6〜10は4×4、11〜20は5×5、21〜45は6×6。46〜60は手数制限つき、61〜80は時間制限つき、81〜100は手数と時間の両方に制限がつく6×6です。</p>
    <button id="reset" class="quiet">進み具合をリセット</button>
  </section>

  <section id="play" hidden style="display:flex;flex-direction:column;gap:16px">
    <p class="rule" id="rule"></p>
    <div class="sizes" id="sizes" role="group" aria-label="盤面の大きさ">
      <button data-n="3" aria-pressed="false">3×3</button>
      <button data-n="4" aria-pressed="false">4×4</button>
      <button data-n="5" aria-pressed="true">5×5</button>
      <button data-n="6" aria-pressed="false">6×6</button>
    </div>
    <div class="stat"><span id="ttl"></span><span><span id="mlab">手数</span> <b id="moves">0</b><span id="tm">0:00</span></span></div>
    <div class="board" id="board" role="grid" aria-label="パズル盤面"></div>
    <p class="msg" id="msg"></p>
    <div class="act">
      <button id="hint">ヒント</button>
      <button id="undo">戻す</button>
      <button id="again">もう一度</button>
      <button id="new">新しい問題</button>
      <button id="list">一覧へ</button>
      <button id="share" hidden>結果を共有</button>
      <button id="next" hidden>次のステージ</button>
    </div>
  </section>
</main>
<div id="help" class="ov" role="dialog" aria-modal="true" aria-labelledby="hh" hidden>
  <div class="card">
    <h2 id="hh">遊び方</h2>
    <ol>
      <li>丸をタップすると、その丸と上下左右の丸の明かりが切り替わります。</li>
      <li>すべての明かりを消せばクリアです。</li>
      <li>手数が少ないほど★が増えます。</li>
      <li>困ったら「ヒント」、押し間違えたら「戻す」を使えます。</li>
    </ol>
    <button id="helpClose">はじめる</button>
  </div>
</div>
<script>
(function(){
  var TOTAL=100, KEY='akari-progress-v1', KEY2='akari-times-v1', DKEY='akari-daily-v1';
  var mode='stage', stage=0, n=5, grid=[], start=[], moves=0, done=false, hints=0, hintCell=null, par=0, hist=[], shareText='', timer=null, t0=0;
  var stars=load(), times=loadT();
  var $=function(id){return document.getElementById(id)};
  var board=$('board'), movesEl=$('moves'), msg=$('msg');

  function load(){
    var s=[];
    try{ var raw=localStorage.getItem(KEY); if(raw) s=JSON.parse(raw); }catch(e){}
    if(!Array.isArray(s)) s=[];
    while(s.length<TOTAL) s.push(0);
    return s.slice(0,TOTAL);
  }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(stars)); }catch(e){} }

  function loadT(){ var t={}; try{ var r=localStorage.getItem(KEY2); if(r) t=JSON.parse(r)||{}; }catch(e){} return t; }
  function saveT(){ try{ localStorage.setItem(KEY2,JSON.stringify(times)); }catch(e){} }
  function pad(x){ return (x<10?'0':'')+x; }
  function dayKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function loadD(){ var d={}; try{ var r=localStorage.getItem(DKEY); if(r) d=JSON.parse(r)||{}; }catch(e){} return d; }
  function saveD(d){ try{ localStorage.setItem(DKEY,JSON.stringify(d)); }catch(e){} }
  function streakNow(d){ var y=new Date(); y.setDate(y.getDate()-1); if(d.last===dayKey(new Date())||d.last===dayKey(y)) return d.streak||0; return 0; }
  function fmt(s){ var m=Math.floor(s/60); s=s%60; return m+':'+(s<10?'0':'')+s; }
  function tickShow(){ $('tm').textContent=fmt(Math.floor((Date.now()-t0)/1000)); }
  function startTimer(){ if(timer||done) return; t0=Date.now(); timer=setInterval(tickShow,250); }
  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } stopCd(); stopLcd(); }

  // ステージの制限(手数・時間)
  var lim={m:0,t:0}, lcd=null, lrem=0, lbase=0, lcd0=0;
  function stopLcd(){
    if(lcd){ clearInterval(lcd); lcd=null; lrem=Math.max(0,lbase-(Date.now()-lcd0)/1000); }
  }
  function lcdTick(){
    lrem=lbase-(Date.now()-lcd0)/1000;
    if(lrem<=0){ lrem=0; $('tm').textContent=fmt(0); stageFail('time'); return; }
    $('tm').textContent=fmt(Math.ceil(lrem));
    $('tm').style.color=(lrem<=10)?'#ff6b6b':'';
  }
  function startLcd(){ if(lcd||done) return; lcd0=Date.now(); lbase=lrem; lcd=setInterval(lcdTick,200); }
  function lcdElapsed(){ return lim.t-Math.max(0,lbase-(Date.now()-lcd0)/1000); }
  function stageFail(why){
    if(done) return;
    done=true; stopTimer(); msg.className='msg';
    msg.textContent=((why==='time')?'時間切れ!':'手数オーバー!')+' 「もう一度」で同じ問題に再挑戦できます。(ヒントも使えます)';
    playFail(); vib([60,40,120]);
  }

  // チャレンジ(手数制限・時間制限)
  var run={over:true,remain:0}, cd=null;
  function loadB(){ var b={}; try{ var r=localStorage.getItem('akari-best-v1'); if(r) b=JSON.parse(r)||{}; }catch(e){} return b; }
  function saveB(b){ try{ localStorage.setItem('akari-best-v1',JSON.stringify(b)); }catch(e){} }
  function playFail(){ [392,330,262].forEach(function(f,i){ tone(f,0.3,'triangle',0.13,i*0.14); }); }
  function stopCd(){
    if(cd){ clearInterval(cd); cd=null; run.remain=Math.max(0,run.base-(Date.now()-run.t0)/1000); }
  }
  function cdTick(){
    run.remain=run.base-(Date.now()-run.t0)/1000;
    if(run.remain<=0){ run.remain=0; $('tm').textContent=fmt(0); endRun(); return; }
    $('tm').textContent=fmt(Math.ceil(run.remain));
    $('tm').style.color=(run.remain<=10)?'#ff6b6b':'';
  }
  function startCountdown(){
    if(cd||done||run.over) return;
    run.started=true; run.t0=Date.now(); run.base=run.remain;
    cd=setInterval(cdTick,200);
  }
  function startRun(kind){
    stopTimer();
    run={kind:kind, level:0, score:0, limit:0, over:false, remain:60, base:60, t0:0, started:false};
    $('rule').textContent=(kind==='mlim')
      ?'手数の上限内でクリアしよう。クリアするたびに盤面が大きくなり、上限がきつくなります。ヒントと戻すは使えません。'
      :'制限時間内にできるだけ多くクリアしよう。クリアするたびに+10秒。ヒントと戻すは使えません。';
    $('share').hidden=true;
    show('play'); runPuzzle();
  }
  // 出題前の安全確認: 計算した解を実際に適用して、本当に全部消える問題だけを出す
  function solvable(g){
    grid=copy(g);
    var x=solve(), h=copy(g);
    for(var i=0;i<n*n;i++){ if(x[i]) press(h,Math.floor(i/n),i%n); }
    return !lit(h);
  }
  function runPuzzle(){
    var lv=run.level;
    n=(run.kind==='mlim')?(lv<3?3:(lv<6?4:(lv<9?5:6))):(lv<2?3:(lv<4?4:(lv<6?5:6)));
    var k=Math.min(n*n-1, n+Math.floor(Math.random()*3)), g;
    do{
      g=blank();
      var cells=[]; for(var j=0;j<n*n;j++) cells.push(j);
      for(j=cells.length-1;j>0;j--){ var q=Math.floor(Math.random()*(j+1)), t=cells[j]; cells[j]=cells[q]; cells[q]=t; }
      for(j=0;j<k;j++) press(g,Math.floor(cells[j]/n),cells[j]%n);
    }while(!lit(g)||!solvable(g));
    setup(g);
    msg.className='msg';
    $('ttl').textContent=((run.kind==='mlim')?'手数制限 ':'時間制限 ')+(run.score+1)+'問目('+n+'×'+n+')';
    if(run.kind==='mlim'){
      run.limit=par+Math.max(1,3-Math.floor(lv/3));
      $('tm').textContent='';
      msg.textContent='上限は '+run.limit+' 手。正しく解けば必ず間に合います。';
      render();
    }else{
      $('tm').textContent=fmt(Math.ceil(run.remain));
      msg.textContent=run.started?'次の問題。':'最初の1手で時間が動き出す。';
      if(run.started) startCountdown();
    }
  }
  function runClear(){
    stopTimer();
    run.score++; run.level++;
    if(run.kind==='tlim'){
      run.remain+=10; $('tm').textContent=fmt(Math.ceil(run.remain)); $('tm').style.color='';
      msg.textContent=run.score+'問クリア! +10秒';
    }else{
      msg.textContent=run.score+'問クリア! 次は盤面と上限が変わります。';
    }
    playWin(2); celebrate(2); vib([20,40,60]);
    var my=run;
    setTimeout(function(){ if(run===my && !run.over && (mode==='mlim'||mode==='tlim')) runPuzzle(); },1100);
  }
  function endRun(){
    if(run.over) return;
    run.over=true; done=true; stopTimer();
    var b=loadB(), k=run.kind, best=b[k]||0, nb=run.score>best;
    if(nb){ b[k]=run.score; saveB(b); }
    msg.className='msg';
    msg.textContent=((k==='mlim')?'手数オーバー!':'時間切れ!')+' '+run.score+'問クリア'+(nb?'(ベスト更新!)':'(ベスト'+best+'問)');
    shareText='あかり消し '+((k==='mlim')?'手数制限':'時間制限')+' '+run.score+'問クリア';
    $('share').hidden=false;
    playFail(); vib([60,40,120]);
  }
  function resetTimer(){ stopTimer(); t0=0; $('tm').textContent='0:00'; }
  function vib(p){ if(!soundOn) return; try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  var COLORS=[null,'#ff6f9b','#3fcf8e','#3aa8ff'];
  var colorIdx=(function(){ try{ return (+localStorage.getItem('akari-color'))||0; }catch(e){ return 0; } })();
  function applyColor(i){
    var r=document.documentElement, h=COLORS[i];
    if(!h){ r.style.removeProperty('--on'); r.style.removeProperty('--on-glow'); return; }
    r.style.setProperty('--on',h);
    r.style.setProperty('--on-glow','rgba('+parseInt(h.substr(1,2),16)+','+parseInt(h.substr(3,2),16)+','+parseInt(h.substr(5,2),16)+',.55)');
  }

  // 効果音(ブラウザの音声機能で鳴らすので、音声ファイルは不要)
  var soundOn=(function(){try{return localStorage.getItem('akari-sound')!=='off';}catch(e){return true;}})();
  var ac=null;
  function tone(f,d,type,vol,delay){
    if(!soundOn) return;
    try{
      if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      var t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
      o.type=type||'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t+d+0.02);
    }catch(e){}
  }
  function playTap(){ tone(500,0.09,'sine',0.12); tone(750,0.06,'triangle',0.05,0.02); }
  function playHint(){ tone(880,0.18,'sine',0.13); tone(1175,0.25,'sine',0.13,0.12); }
  function playWin(s){
    var notes=[523,659,784,1047];
    if(s>=2) notes.push(1319);
    if(s>=3) notes.push(1568,2093);
    notes.forEach(function(f,i){ tone(f,0.35,'triangle',0.14,i*0.11); });
  }

  // クリア演出: 明かりの波と紙吹雪
  function celebrate(s){
    var cells=board.children;
    for(var i=0;i<cells.length;i++){
      var r=Math.floor(i/n), c=i%n;
      cells[i].style.setProperty('--d',((r+c)*70)+'ms');
      cells[i].classList.add('wave');
    }
    var cols=['#ffc857','#ff8fa3','#7ee0c3','#8ab4ff','#ffffff'];
    var num=s>=3?36:(s===2?28:20);
    for(var k=0;k<num;k++){
      var p=document.createElement('span'); p.className='pt';
      var a=Math.random()*Math.PI*2, dist=90+Math.random()*130;
      p.style.setProperty('--x',Math.cos(a)*dist+'px');
      p.style.setProperty('--y',Math.sin(a)*dist+'px');
      p.style.background=cols[k%cols.length];
      board.appendChild(p);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1400); })(p);
    }
  }

  function press(g,r,c){
    [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var y=r+d[0],x=c+d[1];
      if(y>=0&&y<n&&x>=0&&x<n) g[y][x]=!g[y][x];
    });
  }
  function blank(){var g=[];for(var i=0;i<n;i++){g.push([]);for(var j=0;j<n;j++)g[i].push(false)}return g}
  function lit(g){return g.some(function(r){return r.some(Boolean)})}
  function copy(g){return g.map(function(r){return r.slice()})}
  function count(a){return a.reduce(function(s,v){return s+v},0)}

  // 最少手数の解を求める(2を法とする連立方程式)
  function solve(){
    var N=n*n, m=[], i, j, r, c;
    for(i=0;i<N;i++){
      var row=[]; for(j=0;j<=N;j++) row.push(0);
      r=Math.floor(i/n); c=i%n;
      row[i]=1;
      if(r>0) row[i-n]=1;
      if(r<n-1) row[i+n]=1;
      if(c>0) row[i-1]=1;
      if(c<n-1) row[i+1]=1;
      row[N]=grid[r][c]?1:0;
      m.push(row);
    }
    var piv=[], cur=0;
    for(var col=0;col<N;col++){
      var p=-1;
      for(i=cur;i<N;i++){ if(m[i][col]){p=i;break;} }
      if(p<0) continue;
      var t=m[p]; m[p]=m[cur]; m[cur]=t;
      for(i=0;i<N;i++){
        if(i!==cur && m[i][col]){ for(j=0;j<=N;j++) m[i][j]^=m[cur][j]; }
      }
      piv.push(col); cur++;
    }
    var x=[]; for(i=0;i<N;i++) x.push(0);
    for(i=0;i<piv.length;i++) x[piv[i]]=m[i][N];
    var nulls=[];
    for(var f=0;f<N;f++){
      if(piv.indexOf(f)>=0) continue;
      var v=[]; for(i=0;i<N;i++) v.push(0);
      v[f]=1;
      for(i=0;i<piv.length;i++) v[piv[i]]=m[i][f];
      nulls.push(v);
    }
    var best=x, bestN=count(x);
    for(var mask=1;mask<(1<<nulls.length);mask++){
      var y=x.slice();
      for(var k=0;k<nulls.length;k++){
        if(mask&(1<<k)){ for(i=0;i<N;i++) y[i]^=nulls[k][i]; }
      }
      if(count(y)<bestN){best=y;bestN=count(y);}
    }
    return best;
  }

  function rng(seed){
    return function(){
      seed|=0; seed=seed+0x6D2B79F5|0;
      var t=Math.imul(seed^seed>>>15,1|seed);
      t=t+Math.imul(t^t>>>7,61|t)^t;
      return ((t^t>>>14)>>>0)/4294967296;
    };
  }
  function spec(i){
    if(i<15){
      var s0=i<5?3:(i<10?4:5);
      return {size:s0, k:2+(i%5)+(s0-3)*2};
    }
    if(i<20) return {size:5, k:11+(i%5)};
    if(i<30) return {size:6, k:10+(i%5)+(i>=25?4:0)};
    var d;
    if(i<45){ d=i-30; return {size:6, k:16+(d%5)+Math.floor(d/5)*2}; }
    if(i<60){ var ka=22+(i%5)+Math.floor((i-45)/5); return {size:6, k:ka, lm:(i<50?4:(i<55?3:2)), lt:0}; }
    if(i<80){ var kb=12+(i%5)+Math.floor((i-60)/5); return {size:6, k:kb, lm:0, lt:Math.round(kb*(i<70?5:4))}; }
    var kc=14+(i%5)+Math.floor((i-80)/5);
    return {size:6, k:kc, lm:(i<90?3:(i<95?2:1)), lt:Math.round(kc*(i<90?4.5:3.5))};
  }

  function setup(g){
    start=copy(g); grid=copy(g); moves=0; done=false; hints=0; hintCell=null;
    par=count(solve()); hist=[]; resetTimer();
    $('next').hidden=true; $('share').hidden=true;
    render();
  }
  function newPractice(){
    var g, k;
    do{
      g=blank(); k=n*n;
      for(var i=0;i<k;i++){ if(Math.random()<0.5) press(g,Math.floor(Math.random()*n),Math.floor(Math.random()*n)); }
    }while(!lit(g));
    msg.className='msg'; msg.textContent='明かりを全部消そう。';
    setup(g);
  }
  function startStage(i){
    stage=i; var s=spec(i); n=s.size;
    var rand=rng(9001+i*131), g;
    do{
      g=blank();
      var cells=[]; for(var j=0;j<n*n;j++) cells.push(j);
      for(j=cells.length-1;j>0;j--){ var q=Math.floor(rand()*(j+1)), t=cells[j]; cells[j]=cells[q]; cells[q]=t; }
      for(j=0;j<s.k;j++) press(g,Math.floor(cells[j]/n),cells[j]%n);
    }while(!lit(g));
    msg.className='msg'; msg.textContent='明かりを全部消そう。';
    $('ttl').textContent='ステージ '+(i+1)+'('+n+'×'+n+')';
    setup(g);
    lim.m=s.lm?par+s.lm:0; lim.t=s.lt||0; lrem=lim.t;
    $('mlab').textContent=lim.m?'残り手数':'手数'; $('tm').style.color='';
    var notes=[];
    if(lim.m) notes.push('手数は'+lim.m+'手まで');
    if(lim.t) notes.push('制限時間'+fmt(lim.t)+'(最初の1手で開始)');
    if(notes.length) msg.textContent=notes.join('、')+'。';
    if(lim.t) $('tm').textContent=fmt(lim.t);
    render();
  }

  function render(){
    board.style.gridTemplateColumns='repeat('+n+',1fr)';
    board.style.gridTemplateRows='repeat('+n+',1fr)';
    board.style.gap=(n>=7?'6px':'10px');
    board.innerHTML='';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++){
      var b=document.createElement('button');
      b.className='cell'+(grid[r][c]?' on':'')+(hintCell===r*n+c?' hint':'');
      b.setAttribute('role','gridcell');
      b.setAttribute('aria-label',(r+1)+'行'+(c+1)+'列、'+(grid[r][c]?'点灯':'消灯'));
      b.dataset.r=r;b.dataset.c=c;
      board.appendChild(b);
    }
    movesEl.textContent=(mode==='mlim')?Math.max(0,run.limit-moves):((mode==='stage'&&lim.m)?Math.max(0,lim.m-moves):moves);
  }

  function starText(k){return k>0?'★★★'.slice(0,k)+'☆☆☆'.slice(0,3-k):''}
  function renderSelect(){
    var box=$('stages'); box.innerHTML='';
    var sum=0, clr=0;
    stars.forEach(function(v){ sum+=v; if(v>0) clr++; });
    $('total').innerHTML='<span>クリア '+clr+' / '+TOTAL+'</span><span><b>★</b> '+sum+' / '+(TOTAL*3)+'</span>';
    for(var i=0;i<TOTAL;i++){
      var b=document.createElement('button');
      var open=(i===0||stars[i-1]>0);
      b.className='stg'+(stars[i]>0?' cleared':'');
      b.disabled=!open;
      b.dataset.i=i;
      b.setAttribute('aria-label','ステージ'+(i+1)+(open?'':'(ロック中)')+(stars[i]?'、星'+stars[i]+'つ':''));
      b.innerHTML=(open?(i+1):'🔒')+(stars[i]?'<small>'+starText(stars[i])+'</small>':'');
      box.appendChild(b);
    }
    // 次に遊ぶステージが見える位置までスクロール
    var fr=0; while(fr<TOTAL-1&&stars[fr]>0) fr++;
    if(fr>=10){ setTimeout(function(){ try{ box.children[fr].scrollIntoView({block:'center'}); }catch(e){} },0); }
  }

  function show(view){
    if(view==='select') stopTimer();
    $('select').hidden=(view!=='select');
    $('play').hidden=(view!=='play');
    $('select').style.display=(view==='select')?'flex':'none';
    $('play').style.display=(view==='play')?'flex':'none';
  }
  function startDaily(){
    var now=new Date(), dow=now.getDay();
    n=[6,4,5,5,6,6,6][dow];
    var k=Math.round(n*1.8)+(dow%3);
    var rand=rng(now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate()), g;
    do{
      g=blank();
      var cells=[]; for(var j=0;j<n*n;j++) cells.push(j);
      for(j=cells.length-1;j>0;j--){ var q=Math.floor(rand()*(j+1)), t=cells[j]; cells[j]=cells[q]; cells[q]=t; }
      for(j=0;j<k;j++) press(g,Math.floor(cells[j]/n),cells[j]%n);
    }while(!lit(g));
    var d=loadD(), st=streakNow(d), tk=dayKey(now);
    var cleared=(d.ts&&d.ts.d===tk)?d.ts.s:0;
    $('rule').textContent='毎日1問、全員同じ問題です。クリアした日が続くと連続記録が伸びます。';
    $('ttl').textContent='今日('+n+'×'+n+')';
    msg.className='msg';
    msg.textContent='連続 '+st+' 日。'+(cleared?'今日はクリア済み '+starText(cleared)+'。':'明かりを全部消そう。');
    show('play'); setup(g);
  }
  function enterMode(m){
    mode=m; stopTimer(); lim.m=0; lim.t=0;
    Array.prototype.forEach.call($('tabs').children,function(x){x.setAttribute('aria-pressed',x.dataset.m===m?'true':'false')});
    var stg=(m==='stage');
    var ch=(m==='mlim'||m==='tlim');
    $('sizes').hidden=(m!=='free'); $('new').hidden=!(m==='free'||ch); $('list').hidden=!stg;
    $('hint').hidden=ch; $('undo').hidden=ch; $('again').hidden=ch;
    $('new').textContent=ch?'最初から':'新しい問題';
    $('mlab').textContent=(m==='mlim')?'残り手数':'手数'; $('tm').style.color='';
    if(m==='daily'){ startDaily(); return; }
    if(ch){ startRun(m); return; }
    if(stg){ renderSelect(); show('select'); }
    else{
      $('rule').textContent='丸をタップすると、その丸と上下左右の丸の明かりが切り替わります。大きさを選んで自由に練習できます。';
      $('ttl').textContent='練習';
      var pb=$('sizes').querySelector('[aria-pressed="true"]'); n=+pb.dataset.n;
      show('play'); newPractice();
    }
  }

  board.addEventListener('click',function(e){
    var t=e.target.closest('.cell'); if(!t||done) return;
    if(mode==='tlim') startCountdown(); else if(mode==='stage'&&lim.t) startLcd(); else if(mode!=='mlim') startTimer();
    hist.push(+t.dataset.r*n+(+t.dataset.c));
    hintCell=null; press(grid,+t.dataset.r,+t.dataset.c); moves++; render(); playTap(); vib(12);
    if(mode==='mlim'&&lit(grid)&&moves>=run.limit){ endRun(); return; }
    if(mode==='stage'&&lim.m&&lit(grid)&&moves>=lim.m){ stageFail('moves'); return; }
    if(lit(grid)) return;
    done=true; msg.className='msg win';
    if(mode==='mlim'||mode==='tlim'){ runClear(); return; }
    var secs=(mode==='stage'&&lim.t)?Math.floor(lcdElapsed()):Math.floor((Date.now()-t0)/1000); stopTimer(); $('tm').textContent=fmt(secs);
    $('share').hidden=false; vib([20,40,60,40,100]);
    var h=hints?'(ヒント'+hints+'回)':'';
    if(mode==='stage'){
      var s=moves<=par?3:(moves<=par+2?2:1);
      if(s>stars[stage]){stars[stage]=s;save();}
      var bt=times[stage], nb=(!bt||secs<bt);
      if(nb){ times[stage]=secs; saveT(); }
      msg.textContent=moves+'手でクリア! '+starText(s)+h+'(最短'+par+'手・'+fmt(secs)+(nb?'・自己ベスト!':'')+')';
      shareText='あかり消し ステージ'+(stage+1)+'('+n+'×'+n+') '+moves+'手 '+starText(s)+' '+fmt(secs);
      playWin(s); celebrate(s);
      if(stage<TOTAL-1) $('next').hidden=false;
      else msg.textContent+=' 全ステージ制覇!';
    }else{
      if(mode==='daily'){
        var ds=moves<=par?3:(moves<=par+2?2:1), dd=loadD(), tk=dayKey(new Date());
        if(dd.last!==tk){ dd.streak=streakNow(dd)+1; dd.last=tk; }
        dd.ts={d:tk, s:(dd.ts&&dd.ts.d===tk)?Math.max(dd.ts.s,ds):ds};
        saveD(dd);
        msg.textContent=moves+'手でクリア! '+starText(ds)+h+'(最短'+par+'手・'+fmt(secs)+') 連続'+dd.streak+'日';
        shareText='あかり消し 毎日の問題 '+tk+' '+moves+'手 '+starText(ds)+' '+fmt(secs)+' 連続'+dd.streak+'日';
        playWin(ds); celebrate(ds);
      }else{
        msg.textContent=moves+'手でクリア! '+h+'「新しい問題」で次に進もう。';
        shareText='あかり消し 練習 '+n+'×'+n+' '+moves+'手 '+fmt(secs);
        playWin(3); celebrate(3);
      }
    }
  });

  $('hint').onclick=function(){
    if(done) return;
    var idx=solve().indexOf(1);
    if(idx<0) return;
    hintCell=idx; hints++; playHint();
    msg.className='msg'; msg.textContent='光る輪の丸をタップしてみよう。(ヒント'+hints+'回目)';
    render();
  };
  $('again').onclick=function(){
    grid=copy(start);moves=0;done=false;hints=0;hintCell=null;hist=[];resetTimer();
    $('next').hidden=true;$('share').hidden=true;
    if(mode==='stage'&&lim.t){ lrem=lim.t; $('tm').textContent=fmt(lim.t); $('tm').style.color=''; }
    msg.className='msg';msg.textContent='同じ問題にもう一度挑戦。';render();
  };
  $('new').onclick=function(){ if(mode==='mlim'||mode==='tlim') startRun(mode); else newPractice(); };
  $('list').onclick=function(){renderSelect();show('select');};
  $('next').onclick=function(){startStage(stage+1);};
  $('tabs').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(b) enterMode(b.dataset.m);
  });
  $('sizes').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    n=+b.dataset.n;
    Array.prototype.forEach.call(this.children,function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    newPractice();
  });
  $('stages').addEventListener('click',function(e){
    var b=e.target.closest('.stg'); if(!b||b.disabled) return;
    $('rule').textContent='丸をタップすると、その丸と上下左右の丸の明かりが切り替わります。';
    show('play'); startStage(+b.dataset.i);
  });

  function updSnd(){ var b=$('snd'); b.textContent=soundOn?'🔊':'🔇'; b.setAttribute('aria-pressed',soundOn?'true':'false'); }
  $('snd').onclick=function(){
    soundOn=!soundOn;
    try{ localStorage.setItem('akari-sound',soundOn?'on':'off'); }catch(e){}
    updSnd(); playTap();
  };
  updSnd();

  $('undo').onclick=function(){
    if(done||!hist.length) return;
    var c=hist.pop(); press(grid,Math.floor(c/n),c%n); moves--; hintCell=null; render();
    tone(330,0.1,'sine',0.1); vib(8);
  };
  function copyTxt(txt){
    try{ navigator.clipboard.writeText(txt).then(function(){ msg.textContent='結果をコピーしました。貼り付けて送ろう。'; },function(){ msg.textContent=txt; }); }
    catch(e){ msg.textContent=txt; }
  }
  $('share').onclick=function(){
    var txt=shareText||'あかり消し';
    if(navigator.share){ navigator.share({text:txt}).catch(function(err){ if(!err||err.name!=='AbortError') copyTxt(txt); }); }
    else copyTxt(txt);
  };
  $('clr').onclick=function(){
    colorIdx=(colorIdx+1)%COLORS.length; applyColor(colorIdx);
    try{ localStorage.setItem('akari-color',String(colorIdx)); }catch(e){}
    playTap();
  };
  applyColor(colorIdx);
  var rt=null;
  $('reset').onclick=function(){
    var b=this;
    if(!rt){ b.textContent='もう一度押すと記録が全部消えます'; rt=setTimeout(function(){ rt=null; b.textContent='進み具合をリセット'; },4000); return; }
    clearTimeout(rt); rt=null; b.textContent='進み具合をリセット';
    stars=[]; while(stars.length<TOTAL) stars.push(0);
    times={}; save(); saveT(); saveD({});
    renderSelect();
  };
  function openHelp(){ $('help').hidden=false; $('helpClose').focus(); }
  function closeHelp(){ $('help').hidden=true; try{ localStorage.setItem('akari-seen','1'); }catch(e){} }
  $('help-btn').onclick=openHelp;
  $('helpClose').onclick=closeHelp;
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!$('help').hidden) closeHelp(); });
  var seen=false; try{ seen=(localStorage.getItem('akari-seen')==='1'); }catch(e){}

  enterMode('stage');
  if(!seen) openHelp();
})();
</script>
</body>
